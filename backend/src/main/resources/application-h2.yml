server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: jdbc:h2:file:./data/perm_platform;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me-please-replace-0123456789abcdef}
    ttlSeconds: ${JWT_TTL_SECONDS:86400}

